server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/book_eval?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jackson:
    default-property-inclusion: always
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

mybatis:
  configuration:
    map-underscore-to-camel-case: false

# LLM 配置：填入 DashScope API Key 后启用大模型；留空则自动降级为关键词匹配
llm:
  api-key: ""
  model: qwen-plus
  base-url: https://ws-ecrxtk3roiuyzng6.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/text-generation/generation
